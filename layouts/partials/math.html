{{- $KatexCSS := resources.Get "/css/katex.min.css" | fingerprint "sha512" }}
<link rel="stylesheet" href="{{ $KatexCSS.RelPermalink }}" integrity="{{ $KatexCSS.Data.Integrity }}">

{{- $mathJS := slice (resources.Get "/js/katex.min.js") (resources.Get "/js/auto-render.min.js") (resources.Get "/js/math-init.js") | resources.Concat "js/math.js" | minify | fingerprint "sha512" }}
<script defer type="text/javascript" src="{{ $mathJS.RelPermalink }}" integrity="{{ $mathJS.Data.Integrity }}"></script>
